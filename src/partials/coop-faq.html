<section class="faq">
  <div class="container">
    <div class="section-header">
      <p class="section-header__eyebrow">Вопросы и ответы</p>
      <h2 class="section-header__title">Часто задаваемые вопросы</h2>
    </div>

    <div class="faq__list">
      <details class="faq__item" open>
        <summary class="faq__question">
          Как получить доступ к оптовому прайс-листу?
          <span class="faq__icon icon-placeholder">
            <svg><use href="img/sprite.svg#icon" xlink:href="img/sprite.svg#icon"></use></svg>
          </span>
        </summary>
        <p class="faq__answer">
          Заполните форму заявки ниже — после подтверждения статуса партнёра вам откроется доступ в личном
          кабинете.
        </p>
      </details>
      <details class="faq__item">
        <summary class="faq__question">
          Какой минимальный объём закупки для оптовых цен?
          <span class="faq__icon icon-placeholder">
            <svg><use href="img/sprite.svg#icon" xlink:href="img/sprite.svg#icon"></use></svg>
          </span>
        </summary>
      </details>
      <details class="faq__item">
        <summary class="faq__question">
          Можно ли получить бесплатные образцы продукции?
          <span class="faq__icon icon-placeholder">
            <svg><use href="img/sprite.svg#icon" xlink:href="img/sprite.svg#icon"></use></svg>
          </span>
        </summary>
      </details>
    </div>
  </div>
</section>
