<section class="contact-section" id="coop-form">
  <div class="container contact-section__centered">
    <form class="contact-form contact-form--centered">
      <h2 class="contact-form__title">Стать партнером</h2>
      <p class="contact-form__desc">Заполните форму — мы свяжемся с вами в течение 1 рабочего дня</p>

      <div class="contact-form__row">
        <input class="contact-form__field" type="text" placeholder="Название компании">
        <input class="contact-form__field" type="text" placeholder="Вид деятельности">
      </div>
      <div class="contact-form__row">
        <input class="contact-form__field" type="text" placeholder="Имя и фамилия">
        <input class="contact-form__field" type="tel" placeholder="+7 (XXX) XXX-XX-XX">
      </div>
      <textarea class="contact-form__field contact-form__comment" placeholder="Расскажите о вашей компании и объёмах закупок"></textarea>

      <label class="contact-form__check">
        <input class="contact-form__checkbox" type="checkbox">
        <span class="contact-form__check-text">
          Нажимая кнопку вы подтверждаете, что ознакомлены с нашей
          <span class="contact-form__check-accent">Политикой конфиденциальности</span>
        </span>
      </label>
      <label class="contact-form__check">
        <input class="contact-form__checkbox" type="checkbox">
        <span class="contact-form__check-text">
          Нажимая кнопку вы подтверждаете, что даете
          <span class="contact-form__check-accent">Согласие на обработку персональных данных</span>
        </span>
      </label>

      <button class="contact-form__submit" type="submit">Отправить</button>
    </form>
  </div>
</section>
