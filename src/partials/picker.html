<section class="picker-section">
  <div class="container">
    <div class="picker">
      <div class="picker__info">
        <p class="picker__eyebrow">Умный подбор</p>
        <h2 class="picker__title">Подберём корм за 30 секунд</h2>
        <p class="picker__text">
          Ответьте на три вопроса о питомце — и мы порекомендуем подходящую марку и линейку из нашего ассортимента.
        </p>
      </div>

      <div class="picker__quiz">
        <div class="picker__step">
          <p class="picker__step-label">1 · Кто ваш питомец?</p>
          <ul class="picker__options list-reset">
            <li><button type="button" class="picker__option picker__option--active">Кошка</button></li>
            <li><button type="button" class="picker__option">Собака</button></li>
            <li><button type="button" class="picker__option">Грызун</button></li>
            <li><button type="button" class="picker__option">Птица</button></li>
          </ul>
        </div>

        <div class="picker__step">
          <p class="picker__step-label">2 · Возраст</p>
          <ul class="picker__options list-reset">
            <li><button type="button" class="picker__option picker__option--active">Малыш</button></li>
            <li><button type="button" class="picker__option">Взрослый</button></li>
            <li><button type="button" class="picker__option">Возрастной</button></li>
          </ul>
        </div>

        <div class="picker__step">
          <p class="picker__step-label">3 · Что важно?</p>
          <ul class="picker__options picker__options--wrap list-reset">
            <li><button type="button" class="picker__option picker__option--active">Баланс</button></li>
            <li><button type="button" class="picker__option">Чувств. пищеварение</button></li>
            <li><button type="button" class="picker__option">Стерилизованным</button></li>
            <li><button type="button" class="picker__option">Эконом</button></li>
          </ul>
        </div>

        <div class="picker__result">
          <span class="picker__result-img img-placeholder"></span>
          <div class="picker__result-info">
            <p class="picker__result-tag">Рекомендуем · Эконом</p>
            <p class="picker__result-name">Ночной охотник</p>
            <p class="picker__result-line">CONSERVES MIX</p>
          </div>
          <a class="picker__result-btn" href="#">Смотреть →</a>
        </div>
      </div>
    </div>
  </div>
</section>
